name: Build Hands4VR
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate runner
        shell: pwsh
        run: |
          Write-Host "Windows runner OK"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion
