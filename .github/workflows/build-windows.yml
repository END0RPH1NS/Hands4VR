name: Build Hands4VR
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64 unified build
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout Hands4VR
        uses: actions/checkout@v4

      - name: Verify Visual Studio C++ x64 toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe was not found.' }
          $path = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $path) { throw 'Visual Studio C++ x64 build tools were not found.' }
          Write-Host "Using Visual Studio: $path"

      - name: Clone HandOfLesser
        shell: pwsh
        run: git clone --recursive --depth 1 https://github.com/TheRoughy/HandOfLesser.git third_party/HandOfLesser

      - name: Clone VRChat Bridge Hub
        shell: pwsh
        run: git clone --depth 1 https://github.com/shazamifius/VRchatFACE-HAND-ARM-tracking.git third_party/VRchatFACE-HAND-ARM-tracking

      - name: Clone additional hand tracking sources
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/Dyslex1k/VRC-Skeletal-Hands.git third_party/VRC-Skeletal-Hands
          git clone --depth 1 https://github.com/NovaAshwolfDev/HandCameraDriver.git third_party/HandCameraDriver
          git clone --depth 1 https://github.com/chnoblouch/aethervr.git third_party/aethervr

      - name: Build HandOfLesser native driver
        shell: cmd
        working-directory: third_party/HandOfLesser
        run: build.bat release --clean

      - name: Prepare unified Hands4VR sources
        shell: pwsh
        run: .\scripts\prepare-unified.ps1

      - name: Sanitize generated Rust source
        shell: pwsh
        run: |
          $libPath = Join-Path $PWD 'third_party/VRchatFACE-HAND-ARM-tracking/hub/src-tauri/src/lib.rs'
          $lib = Get-Content $libPath -Raw
          $literal = [string]([char]0x60) + 'n'
          if ($lib.Contains($literal)) {
            $lib = $lib.Replace($literal, [Environment]::NewLine)
            Set-Content $libPath $lib -Encoding UTF8
            Write-Host 'Removed literal PowerShell newline escape from generated Rust source.'
          }
          if ($lib.Contains($literal)) { throw 'Generated Rust still contains a literal backtick-n escape.' }
          Select-String -Path $libPath -Pattern 'start_handoflesser|get_cameras' | ForEach-Object { $_.Line }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build unified Tauri application
        shell: pwsh
        working-directory: third_party/VRchatFACE-HAND-ARM-tracking/hub
        run: |
          $ErrorActionPreference = 'Stop'
          npm install
          Write-Host '--- package.json scripts ---'
          node -e "console.log(require('./package.json').scripts)"
          Write-Host '--- Tauri CLI version ---'
          npx tauri --version
          Write-Host '--- Tauri build ---'
          npx tauri build --ci --bundles nsis,msi
          Write-Host '--- produced files ---'
          if (Test-Path 'src-tauri/target') {
            Get-ChildItem 'src-tauri/target' -Recurse -File -Include *.exe,*.msi | Select-Object FullName,Length | Format-Table -AutoSize
          } else {
            throw 'Tauri target directory was not created.'
          }

      - name: Assemble final package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hub = Join-Path $PWD 'third_party/VRchatFACE-HAND-ARM-tracking/hub'
          $release = Join-Path $hub 'src-tauri/target/release'
          if (-not (Test-Path $release)) {
            throw "Tauri release directory was not produced: $release"
          }
          $candidate = Get-ChildItem $release -Filter '*.exe' -File | Where-Object { $_.Name -notmatch 'setup|uninstall' } | Select-Object -First 1
          if (-not $candidate) {
            Get-ChildItem (Join-Path $hub 'src-tauri/target') -Recurse -File -Include *.exe,*.msi | Select-Object FullName,Length | Format-Table -AutoSize
            throw 'No application executable was produced by Tauri.'
          }
          New-Item -ItemType Directory -Force -Path dist/Hands4VR | Out-Null
          Copy-Item $candidate.FullName dist/Hands4VR/Hands4VR.exe -Force
          $nsis = Join-Path $release 'bundle/nsis'
          $msi = Join-Path $release 'bundle/msi'
          if (Test-Path $nsis) { Copy-Item -Recurse -Force (Join-Path $nsis '*') dist/Hands4VR/ }
          if (Test-Path $msi) { Copy-Item -Recurse -Force (Join-Path $msi '*') dist/Hands4VR/ }
          Copy-Item BUILD_COMPONENTS.txt dist/Hands4VR/BUILD_COMPONENTS.txt -Force
          $sourceArchive = 'dist/Hands4VR/source-components'
          New-Item -ItemType Directory -Force -Path $sourceArchive | Out-Null
          Copy-Item -Recurse -Force third_party/VRC-Skeletal-Hands $sourceArchive/VRC-Skeletal-Hands
          Copy-Item -Recurse -Force third_party/HandCameraDriver $sourceArchive/HandCameraDriver
          Copy-Item -Recurse -Force third_party/aethervr $sourceArchive/aethervr
          Set-Content dist/Hands4VR/BUILD_INFO.txt "Hands4VR`n`nUnified Windows application: VRChat Bridge Hub + HandOfLesser SteamVR/OpenXR hand driver.`nAdditional supplied projects are included under source-components." -Encoding UTF8

      - name: Upload Hands4VR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hands4VR-Windows-x64
          path: dist/Hands4VR
          if-no-files-found: error
          retention-days: 30
