name: Build Hands4VR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64 unified build
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout Hands4VR
        uses: actions/checkout@v4

      - name: Verify Visual Studio C++ x64 toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe was not found.' }
          $path = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $path) { throw 'Visual Studio C++ x64 build tools were not found.' }
          Write-Host "Using Visual Studio: $path"

      - name: Clone pinned Bridge Hub
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/shazamifius/VRchatFACE-HAND-ARM-tracking.git third_party/VRchatFACE-HAND-ARM-tracking
          git -C third_party/VRchatFACE-HAND-ARM-tracking fetch --depth 1 origin 87bfddc33f66a12cf8e38c33e1546ccb5f2bb1c
          git -C third_party/VRchatFACE-HAND-ARM-tracking checkout --detach 87bfddc33f66a12cf8e38c33e1546ccb5f2bb1c

      - name: Clone pinned HandOfLesser
        shell: pwsh
        run: |
          git clone --recursive --depth 1 https://github.com/TheRoughy/HandOfLesser.git third_party/HandOfLesser
          git -C third_party/HandOfLesser fetch --depth 1 origin a10cc0092c3fe71ba06c68cdbc19d1ad14ad9fff
          git -C third_party/HandOfLesser checkout --detach a10cc0092c3fe71ba06c68cdbc19d1ad14ad9fff
          git -C third_party/HandOfLesser submodule update --init --recursive

      - name: Collect supplied tracking sources
        shell: pwsh
        run: |
          $projects = @{
            'VRC-Skeletal-Hands' = @{
              url = 'https://github.com/Dyslex1k/VRC-Skeletal-Hands.git'
              sha = 'e348af3a48fa1af0d568ed1204946663073ca799'
            }
            'HandCameraDriver' = @{
              url = 'https://github.com/NovaAshwolfDev/HandCameraDriver.git'
              sha = '10f1216ddddf298c455d30d5827b2415470aba01'
            }
            'aethervr' = @{
              url = 'https://github.com/chnoblouch/aethervr.git'
              sha = '4fe854d0b5b32da2b1f0ae423b1b7210259fb286'
            }
          }
          New-Item -ItemType Directory -Force -Path third_party/sources | Out-Null
          foreach ($p in $projects.GetEnumerator()) {
            $dst = Join-Path 'third_party/sources' $p.Key
            Write-Host "Collecting $($p.Key) @ $($p.Value.sha)"
            git clone --depth 1 $p.Value.url $dst
            if ($LASTEXITCODE -ne 0) { throw "Failed to clone $($p.Key)" }
            git -C $dst fetch --depth 1 origin $p.Value.sha
            if ($LASTEXITCODE -ne 0) { throw "Failed to fetch pinned commit for $($p.Key)" }
            git -C $dst checkout --detach $p.Value.sha
            if ($LASTEXITCODE -ne 0) { throw "Failed to checkout pinned commit for $($p.Key)" }
          }

      - name: Build HandOfLesser native driver
        shell: cmd
        working-directory: third_party/HandOfLesser
        run: build.bat release --clean

      - name: Prepare unified integration
        shell: pwsh
        run: .\scripts\prepare-unified.ps1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build unified Tauri application
        shell: pwsh
        working-directory: third_party/VRchatFACE-HAND-ARM-tracking/hub
        run: |
          $ErrorActionPreference = 'Stop'
          npm install
          npx tauri --version
          npx tauri build --ci --bundles nsis,msi

      - name: Assemble final package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hub = Join-Path $PWD 'third_party/VRchatFACE-HAND-ARM-tracking/hub'
          $release = Join-Path $hub 'src-tauri/target/release'
          if (-not (Test-Path $release)) { throw "Tauri release directory was not produced: $release" }

          $candidate = Get-ChildItem $release -Filter '*.exe' -File |
            Where-Object { $_.Name -notmatch 'setup|uninstall' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $candidate) { throw 'No application executable was produced by Tauri.' }

          New-Item -ItemType Directory -Force -Path dist/Hands4VR | Out-Null
          Copy-Item $candidate.FullName dist/Hands4VR/Hands4VR.exe -Force

          $nsis = Join-Path $release 'bundle/nsis'
          $msi = Join-Path $release 'bundle/msi'
          if (Test-Path $nsis) { Copy-Item -Recurse -Force (Join-Path $nsis '*') dist/Hands4VR/ }
          if (Test-Path $msi) { Copy-Item -Recurse -Force (Join-Path $msi '*') dist/Hands4VR/ }

          Copy-Item BUILD_COMPONENTS.txt dist/Hands4VR/BUILD_COMPONENTS.txt -Force
          New-Item -ItemType Directory -Force -Path dist/Hands4VR/source-components | Out-Null
          Copy-Item -Recurse -Force third_party/sources dist/Hands4VR/source-components/

          @"
          Hands4VR unified Windows build
          Core GUI/tracking/OSC: VRChat Bridge Hub @ 87bfddc33f66a12cf8e38c33e1546ccb5f2bb1c
          SteamVR/OpenXR driver: HandOfLesser @ a10cc0092c3fe71ba06c68cdbc19d1ad14ad9fff
          Camera backend: native Bridge Hub pipeline; no source patching or forced backend override.
          Additional supplied repositories are staged as source components and are not launched as competing camera processes.
          "@ | Set-Content dist/Hands4VR/BUILD_INFO.txt -Encoding UTF8

      - name: Upload Hands4VR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hands4VR-Windows-x64
          path: dist/Hands4VR
          if-no-files-found: error
          retention-days: 30
